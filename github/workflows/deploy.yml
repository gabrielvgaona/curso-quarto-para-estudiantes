name: Deploy Quarto site to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    container:
      image: rocker/verse:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y curl jq lftp wget sudo
          apt install -y cmake git gsfonts libabsl-dev libcairo2-dev libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev libfribidi-dev libgdal-dev libgeos-dev libgl1-mesa-dev libglpk-dev libglu1-mesa-dev libharfbuzz-dev libicu-dev libjpeg-dev libmagick++-dev libmysqlclient-dev libnode-dev libpng-dev libpoppler-cpp-dev libproj-dev libprotobuf-dev libprotoc-dev libsodium-dev libsqlite3-dev libssh2-1-dev libssl-dev libtiff-dev libudunits2-dev libuv1-dev libwebp-dev libx11-dev libxml2-dev make poppler-data protobuf-compiler python3  unixodbc-dev zlib1g-dev

      - name: Install Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      
      - name: Install R dependencies
        run: |
          R -e "install.packages(c('rmarkdown', 'gt'))"
        
      - name: Render Quarto site
        run: quarto render

      - name: Deploy site to cPanel
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
          CPANEL_TARGET_DIR: ${{ secrets.CPANEL_TARGET_DIR }}
          CPANEL_PROTOCOL: ${{ secrets.CPANEL_PROTOCOL }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          HOST="$CPANEL_HOST"
          USERNAME="$CPANEL_USERNAME"
          PASSWORD="$CPANEL_PASSWORD"
          TARGET_DIR="$CPANEL_TARGET_DIR"
          PROTOCOL="${CPANEL_PROTOCOL:-sftp}"
          PORT="$CPANEL_PORT"

          if [ -z "$HOST" ] || [ -z "$USERNAME" ] || [ -z "$PASSWORD" ] || [ -z "$TARGET_DIR" ]; then
            echo "Error: One or more required secrets are missing."
            exit 1
          fi

          if [ -z "$PORT" ]; then
            if [ "$PROTOCOL" = "sftp" ]; then
              PORT=22
            else
              PORT=21
            fi
          fi

          echo "Deploying _book/ to $PROTOCOL://$HOST:$PORT/$TARGET_DIR"

          if [ "$PROTOCOL" = "sftp" ]; then
            lftp -u "$USERNAME","$PASSWORD" -p "$PORT" sftp://"$HOST" << EOF
          set sftp:auto-confirm yes
          mirror -R --delete --verbose _book/ "$TARGET_DIR"
          quit
          EOF
          else
            lftp -u "$USERNAME","$PASSWORD" -p "$PORT" "$PROTOCOL://$HOST" << EOF
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ssl:verify-certificate no
          set ftp:passive-mode on
          mirror -R --delete --verbose _book/ "$TARGET_DIR"
          quit
          EOF
          fi

